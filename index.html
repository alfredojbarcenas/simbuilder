<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Build anesthesia simulation facilitator sheets, learner handouts and AI handoffs.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sim Case Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: case library rail on the left, one long form on the right; stacks to a single column on phones. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#e7edf2; --ink:#17212b; --muted:#566472; --line:#d3dbe3;
  --accent:#1d5e8c; --accent-ink:#ffffff; --accent-soft:#dcebf6;
  --tbc:#9a5600; --tbc-bg:#fcefd9; --ok:#23704a; --ok-bg:#dff2e7; --danger:#b3261e; --danger-bg:#fbe3e1;
  --hr:#1c8a4a; --bp:#c0362c; --spo2:#0a7ea3; --etco2:#a87b00; --rr:#6c55b8; --temp:#566472;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1c2832; --ink:#e2e8ee; --muted:#93a2b0; --line:#2a3743;
  --accent:#6fb0de; --accent-ink:#0a1520; --accent-soft:#1b3346;
  --tbc:#f1b45a; --tbc-bg:#3a2a11; --ok:#6fd09b; --ok-bg:#15301f; --danger:#ff8a80; --danger-bg:#3b1a18;
  --hr:#4fd685; --bp:#ff6f61; --spo2:#45c8ef; --etco2:#f2c94c; --rr:#ad98ff; --temp:#93a2b0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1c2832; --ink:#e2e8ee; --muted:#93a2b0; --line:#2a3743;
  --accent:#6fb0de; --accent-ink:#0a1520; --accent-soft:#1b3346;
  --tbc:#f1b45a; --tbc-bg:#3a2a11; --ok:#6fd09b; --ok-bg:#15301f; --danger:#ff8a80; --danger-bg:#3b1a18;
  --hr:#4fd685; --bp:#ff6f61; --spo2:#45c8ef; --etco2:#f2c94c; --rr:#ad98ff; --temp:#93a2b0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
/* ---------- library rail ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.rail-actions{display:flex;gap:8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.list{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.item{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;padding:10px 10px;border:1px solid transparent;border-radius:var(--r);background:none}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.item .t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.item .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rail-note{font-size:12px;color:var(--muted);margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.mobile-pick{display:none}

/* ---------- buttons & chips ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.chip.tbc{background:var(--tbc-bg);color:var(--tbc)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.st-draft{background:var(--surface-2);color:var(--muted)}
.chip.st-review{background:var(--accent-soft);color:var(--accent)}
.chip.st-ready{background:var(--ok-bg);color:var(--ok)}
button.chip{border:0;cursor:pointer}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tabs button{border:0;background:none;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.save{font-size:12.5px;color:var(--muted);min-width:0}
.save.err{color:var(--danger)}
.spacer{flex:1}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-block:24px 80px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.banner.warn{background:var(--tbc-bg);color:var(--ink)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:2fr 1fr 1fr}
.g2{grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.help{font-size:12.8px;color:var(--muted);line-height:1.45;margin:0}
.tips-off .help{display:none}
input[type=text],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);line-height:1.45}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);background:var(--surface)}
textarea{resize:vertical;min-height:64px;overflow:hidden}
.field.is-tbc textarea,.field.is-tbc input{border-color:color-mix(in srgb,var(--tbc) 45%,var(--line))}
::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.title-input{font-size:22px;font-weight:600;letter-spacing:-.01em;padding:6px 10px;background:transparent;border-color:transparent}
.title-input:hover{border-color:var(--line)}

/* vitals: monitor channel colors */
.vitals{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.vital{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.vital label{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em}
.vital small{font-size:10.5px;color:var(--muted)}
.vital input{border:0;background:none;padding:0;font-family:var(--f-mono);font-size:18px;font-weight:600;box-shadow:none!important;font-variant-numeric:tabular-nums}
.vital input:focus{background:none}
.vital:focus-within{border-color:var(--accent)}
.v-hr label,.v-hr input{color:var(--hr)} .v-bp label,.v-bp input{color:var(--bp)} .v-spo2 label,.v-spo2 input{color:var(--spo2)}
.v-etco2 label,.v-etco2 input{color:var(--etco2)} .v-rr label,.v-rr input{color:var(--rr)} .v-temp label,.v-temp input{color:var(--temp)} .v-rhythm label,.v-rhythm input{color:var(--hr)}
.v-rhythm input{font-size:14px;padding-top:3px}

/* stages */
.stage{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2)}
.stage-n{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent);min-width:1.5em}
.stage-h input{flex:1;min-width:160px;font-weight:600;background:var(--surface)}
.stage-tools{display:flex;gap:4px}
.stage-b{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stage-b .full{grid-column:1/-1}
.add-stage{align-self:flex-start}

/* empty state / sheet */
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:40px 24px;max-width:560px}
.empty h1{margin:0;font-size:22px}
.empty p{margin:0;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 30px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.sheet h1{margin:0;font-size:20px}
.sheet .meta{color:var(--muted);font-size:13px}
.sheet p{margin:0;white-space:pre-wrap}
.sheet h3{margin:8px 0 0;font-size:16px}
.tbcw{color:var(--tbc);font-weight:600}
.tscroll{overflow-x:auto}
.sheet table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.sheet th{background:var(--surface-2);text-align:left;padding:8px;border:1px solid var(--line);vertical-align:bottom}
.sheet td{padding:8px;border:1px solid var(--line);vertical-align:top;white-space:pre-wrap}
.sheet tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.mono{font-family:var(--f-mono);font-size:12.5px;line-height:1.5}
textarea.mono{overflow:auto;resize:vertical}
#promptOut{min-height:280px;background:var(--surface-2)}
.mono-i{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);padding:0 4px;border-radius:4px;overflow-wrap:anywhere}
.found{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.found .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pre{margin:0;white-space:pre-wrap;font-size:13.5px}
.ai-sec{border-color:color-mix(in srgb,var(--tbc) 45%,var(--line));background:color-mix(in srgb,var(--tbc-bg) 55%,var(--surface))}
.tabs{flex-wrap:wrap}
.sec > .sec-body{display:flex;flex-direction:column;gap:14px}
.sec.collapsed{padding-block:12px}
.sec-toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:2px 4px 2px 0;color:inherit;cursor:pointer;border-radius:6px}
.sec-toggle:hover h2,.sec-toggle:hover .stage-n{color:var(--accent)}
.caret{flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s ease}
.sec-toggle[aria-expanded="false"] .caret{transform:rotate(-45deg)}
.sec-tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:-10px}
.stage.collapsed .stage-h{border-bottom:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;font-size:14px}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
/* readable sheets */
.sheet p{white-space:normal}
.sheet ul,.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sheet li{padding-left:2px}
.sheet li::marker{color:var(--accent)}
.sheet td p + p{margin-top:4px}
.sheet ul.sub{margin-top:4px;font-weight:400;list-style:disc}
.sheet li:has(> ul.sub){font-weight:600}
.blk{gap:4px!important}
.blk h4{margin-bottom:4px!important}
.sheet p + ul,.sheet p + ol,.sheet ul + p,.sheet ol + p,.sheet ul + ol,.sheet ol + ul{margin-top:6px}
.fsheet{gap:22px;font-size:14.5px;line-height:1.55}
.fsheet h3{margin:6px 0 -6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.blk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 32px}
.blk.summary{padding:14px 16px;border-radius:var(--r);background:var(--surface-2)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{font-family:var(--f-mono);font-size:13px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.vchip b{font-size:11px;letter-spacing:.04em}
.vchip small{color:var(--muted);font-size:10.5px}
.vchip.v-hr,.vchip.v-rhythm{color:var(--hr)} .vchip.v-bp{color:var(--bp)} .vchip.v-spo2{color:var(--spo2)} .vchip.v-etco2{color:var(--etco2)} .vchip.v-rr{color:var(--rr)}
.fsheet table{font-size:13.5px;line-height:1.5;min-width:780px}
.fsheet th{padding:10px 12px;font-size:12.5px}
.fsheet td{padding:12px;white-space:normal}
.fsheet td ul{gap:6px}
.sname{font-weight:700;color:var(--accent);margin-bottom:6px}
.lsheet ul,.lsheet ol{gap:6px}
#scenarioSec{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.next-step{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next-step .help{flex:1 1 240px;min-width:0}
.lbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbar .help{flex:1 1 260px;min-width:0}
.lbar .spacer{flex:0 0 0}
.lsheet{max-width:760px;gap:18px;padding:32px 36px}
.lsheet section{display:flex;flex-direction:column;gap:4px}
.lsheet h3{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.lsheet p{font-size:15px;line-height:1.6}
.lrules{border-top:1px solid var(--line);padding-top:14px}
.lrules p{color:var(--muted);font-size:14px}

@media (max-width:900px){
  .vitals{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:1fr 1fr}
  .g3 .field:first-child{grid-column:1/-1}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .list,.search,.rail-note{display:none}
  .mobile-pick{display:block}
  .bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sec{padding:14px}
  .stage-b,.g2{grid-template-columns:1fr}
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  var clone = function(o){ return JSON.parse(JSON.stringify(o)); };
  function snap(){
    var md = {fromCache:false, hasPendingWrites:false};
    var docs = Object.keys(store).map(function(id){ return {id:id, exists:true, data:function(){ return clone(store[id]); }, metadata:md}; });
    return {docs:docs, size:docs.length, empty:!docs.length, metadata:md, docChanges:function(){ return []; }};
  }
  function emit(){ var s = snap(); listeners.forEach(function(f){ try { f(s); } catch(e){ console.error(e); } }); }
  function rid(){ return Math.random().toString(36).slice(2, 12); }
  function docRef(id){
    return {id:id, path:'cases/' + id,
      set:function(d){ store[id] = clone(d); save(); setTimeout(emit, 0); return Promise.resolve(); },
      update:function(d){ store[id] = Object.assign(store[id] || {}, clone(d)); save(); setTimeout(emit, 0); return Promise.resolve(); },
      delete:function(){ delete store[id]; save(); setTimeout(emit, 0); return Promise.resolve(); },
      get:function(){ return Promise.resolve({id:id, exists:!!store[id], data:function(){ return store[id] && clone(store[id]); }}); }};
  }
  var db = {
    collection:function(p){ return {path:p, doc:function(id){ return docRef(id || rid()); },
      onSnapshot:function(cb){ listeners.add(cb); setTimeout(function(){ cb(snap()); }, 0); return function(){ listeners.delete(cb); }; }}; },
    doc:function(p){ return docRef(String(p).split('/').pop()); }
  };
  var downloads = { save:function(r){

    setTimeout(function(){ a.remove(); }, 1000);

  }};
  window.claude = { use:function(n){ return Promise.resolve(n === 'db' ? db : n === 'downloads' ? downloads : null); } };

function parseImport(text){

  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) cands.push(t.slice(a, b + 1));
  let src = null, fallback = null;
  for (const c of cands) {
    try { const o = JSON.parse(c); if (o && typeof o === 'object' && !Array.isArray(o)) { if (Array.isArray(o.stages)) { src = o; break; } if (!fallback) fallback = o; } } catch(e){}
  }
  if (!src) src = fallback;
  if (!src) return {error:/\?\s*$/m.test(t) && !/```/.test(t)
    ? 'This looks like the AI\'s questions, not the case file. Answer them in the AI chat (or reply "go"), then bring back the file it creates.'
    : 'No valid case JSON found. Paste the AI\'s whole reply, including the ```json block. If the AI added text inside the JSON, ask it to "return only the JSON block".'};
  if (!Array.isArray(src.stages)) return {error:'This JSON has no "stages" list, so it does not look like a case from the AI handoff prompt.'};
  const str = v => v == null ? '' : Array.isArray(v) ? v.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join('\n') : typeof v === 'object' ? JSON.stringify(v) : String(v);
  const c = {
    title:str(src.title) || 'Imported case', level:str(src.level), duration:str(src.duration), status:'draft',
    scenario:str(src.scenario), objective:str(src.objective), patient:str(src.patient), learnerBrief:str(src.learnerBrief), roles:str(src.roles), setup:str(src.setup),

function secAttrs(key){ return `data-sec="${esc(key)}" class="sec ${S.collapsed.has(key)?'collapsed':''}"`; }
function secHead(key, title){
  const col = S.collapsed.has(key);

function secCounts(c){
  const cnt = {scenario:0, overview:0, initial:0, stages:0, end:0};
  tbcList(c).forEach(k => {
    if (k === 'scenario') cnt.scenario++;
    else if (k.startsWith('stages.')) { cnt.stages++; const s = c.stages[+k.split('.')[1]]; if (s) cnt['stage:'+s.id] = (cnt['stage:'+s.id]||0) + 1; }
    else if (['objective','patient','learnerBrief','roles','setup'].includes(k)) cnt.overview++;
    else if (k === 'initial' || k === 'vent') cnt.initial++;
    else if (k === 'end' || k === 'debrief') cnt.end++;
  });
  return cnt;
}
function updateSecChips(){
  if (!S.draft) return;

}

function vitalsLine(c){

  return parts.join(' · ');

/* Readable text: "- " bullets, "1. " numbering, bold "Label:" prefixes. Shared by the sheets and Word export. */
const BULLET_RE = /^[-•*–]\s+(.*)$/, NUM_RE = /^(\d+)[.)]\s+(.*)$/, LABEL_RE = /^([A-Za-z][^:→>]{0,30}?):\s+(.+)$/, HEAD_RE = /^([A-Za-z][^:→>]{0,30}):$/;
const cleanMd = s => String(s).replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#+\s*/, '');
/* Split "Label: value" (bold label), or a label-only line "References:" (bold whole). IF-branches are never labels. */
function splitLabel(raw){
  if (/^IF\b/.test(raw)) return null;
  let m = raw.match(LABEL_RE); if (m && !/^https?$/i.test(m[1])) return [m[1] + ':', m[2]];
  m = raw.match(HEAD_RE); if (m) return [raw, ''];
  return null;
}
function inl(s){
  const raw = cleanMd(s);
  const tb = h => h.replace(/\bTBC\b/g, '<span class="tbcw">TBC</span>');
  const lab = splitLabel(raw);
  return lab ? `<b>${tb(esc(lab[0]))}</b>${lab[1] ? ' ' + tb(esc(lab[1])) : ''}` : tb(esc(raw));
}
function fmtHtml(text){
  const t = String(text || '');
  if (!t.trim()) return '<p><span class="tbcw">TBC</span></p>';
  let out = '', list = null, liOpen = false, nested = false;
  const closeNested = () => { if (nested) { out += '</ul>'; nested = false; } };
  const closeLi = () => { closeNested(); if (liOpen) { out += '</li>'; liOpen = false; } };
  const close = () => { closeLi(); if (list) { out += `</${list}>`; list = null; } };
  for (const r of t.split('\n')) {
    const l = r.trim(); if (!l) { close(); continue; }
    let m;
    if ((m = l.match(BULLET_RE))) {
      if (list === 'ol' && liOpen) { if (!nested) { out += '<ul class="sub">'; nested = true; } out += `<li>${inl(m[1])}</li>`; }
      else { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inl(m[1])}</li>`; }
    } else if ((m = l.match(NUM_RE))) {
      if (list !== 'ol') { close(); out += `<ol start="${+m[1]}">`; list = 'ol'; } else closeLi();
      out += `<li>${inl(m[2])}`; liOpen = true;
    } else { close(); out += `<p>${inl(l)}</p>`; }
  }
  close(); return out;
}
function vitalsChips(c){
  const vs = VITALS.filter(([k]) => c.vitals[k]);
  return vs.length ? `<div class="vchips">${vs.map(([k,l,u]) => `<span class="vchip v-${k}"><b>${l}</b> ${esc(c.vitals[k])}${u && k!=='rhythm' ? ' <small>'+u+'</small>' : ''}</span>`).join('')}</div>` : '<p><span class="tbcw">TBC</span></p>';

const PREBRIEF_RULES = 'Treat the mannequin as a real patient. Say out loud what you notice and what you are doing. Ask for anything you would ask for in a real OR, and call for help when you would in real life. Mistakes here are expected and stay in this room.';
function learnerDoc(c, mode){
  if (mode === 'pre') {
    return {
      title:'Simulation case' + (c.level ? ' · ' + c.level : ''),
      sub:'Pre-brief · read before the scenario',
      blocks:[
        {h:'Your role and task', text:c.learnerBrief},
        {h:'Patient', text:c.patient},
        {h:'Before you start', text:PREBRIEF_RULES, fixed:true}
      ]
    };
  }
  const happened = c.stages.map((s,i) => {
    const ev = String(s.event || 'TBC').split('\n').map(l => l.trim()).filter(Boolean).map(l => BULLET_RE.test(l) ? l : '- ' + l.replace(NUM_RE, '$2'));
    return [`${i+1}. ${s.name || 'Stage ' + (i+1)}`].concat(ev).join('\n');
  }).join('\n');
  const seen = new Set();
  const actions = c.stages.flatMap(s => String(s.actions || '').split('\n'))
    .map(l => l.replace(/^[\s\-•*]+/, '').trim()).filter(l => l && !/^TBC\b/i.test(l) && !seen.has(l.toLowerCase()) && seen.add(l.toLowerCase()))
    .map(l => '- ' + l.replace(/\s*\[(critical|key)\]/ig, '')).join('\n');
  return {
    title:c.title || 'Simulation case',
    sub:'Debrief handout' + (c.level ? ' · ' + c.level : ''),
    blocks:[
      {h:'Objectives', text:c.objective},
      {h:'The scenario', text:c.patient},
      {h:'What happened', text:c.stages.length ? happened : ''},
      {h:'Key actions', text:actions},
      {h:'Debrief points', text:c.debrief}
    ]
  };
}
function learnerText(c, mode){
  const d = learnerDoc(c, mode);
  return [d.title, d.sub, ''].concat(d.blocks.flatMap(b => [b.h.toUpperCase(), String(b.text || '').trim() || 'TBC', ''])).join('\n').trim();
}

/* ---------- edits + saving ---------- */
function setPath(o, path, val){
  const ks = path.split('.'); let t = o;
  for (let i = 0; i < ks.length - 1; i++) t = t[/^\d+$/.test(ks[i]) ? +ks[i] : ks[i]];
  t[ks[ks.length-1]] = val;
}
function changed(){
  S.editSeq++; S.err = '';
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(save, 1100);
  renderSaveState();
}
async function save(){
  clearTimeout(S.saveTimer);
  if (!S.db || !S.draft || !S.currentId || !S.canWrite) return;
  if (S.saving) { await S.saving.catch(()=>{}); if (S.editSeq > S.savedSeq) return save(); return; }
  if (S.editSeq <= S.savedSeq) return;
  const seq = S.editSeq, id = S.currentId, rev = rid();
  S.ownRevs.add(rev);
  const body = clone(S.draft);
  body.rev = rev; body.updatedAt = Date.now(); body.updatedBy = S.myId || null;
  S.saving = S.db.doc('cases/' + id).set(body);
  renderSaveState();
  try {
    await S.saving;
    if (S.currentId === id && S.draft) { S.draft.rev = rev; S.draft.updatedAt = body.updatedAt; S.draft.updatedBy = body.updatedBy; }
    S.savedSeq = Math.max(S.savedSeq, seq);
  } catch(e) {
    if (e && e.code === 'invalid_argument' && S.user && (await safeCan()) !== true) { S.canWrite = false; S.err = 'You have view-only access, so changes were not saved.'; renderMain(); }
    else S.err = e && e.code === 'quota_exceeded' ? 'The case library is full. Delete old cases to save.' : 'Could not save. Check your connection; your edits are still here.';
  } finally {
    S.saving = null; renderSaveState(); renderList();
    if (S.editSeq > S.savedSeq && !S.err) S.saveTimer = setTimeout(save, 600);
  }
}
async function safeCan(){ try { return await S.user.can('data.write'); } catch(e){ return null; } }
async function flush(){ if (S.editSeq > S.savedSeq) await save(); }

async function openCase(id){
  if (id === S.currentId) return;
  await flush();
  const c = S.cases.get(id); if (!c) return;
  S.currentId = id; S.draft = normalize(c); S.editSeq = S.savedSeq = 0; S.remoteChanged = false; S.confirmDel = false; S.err = '';
  ls.set('simcase:last', id);
  renderList(); renderMain(); window.scrollTo(0,0);
}
async function createCase(fromDraft, imported){
  if (!S.db || !S.canWrite) return;
  await flush();
  const id = S.db.collection('cases').doc().id;
  const body = fromDraft ? normalize(fromDraft) : imported ? normalize(imported) : blankCase();
  if (fromDraft) { body.title = (body.title || 'Untitled case') + ' (copy)'; body.status = 'draft'; body.stages.forEach(s => s.id = rid()); }
  body.createdAt = body.updatedAt = Date.now(); body.updatedBy = S.myId || null;
  body.rev = rid(); S.ownRevs.add(body.rev);
  try {
    await S.db.doc('cases/' + id).set(body);
    S.cases.set(id, body);
    S.currentId = null; await openCase(id);
    toast(fromDraft ? 'Duplicated. You are editing the copy.' : imported ? 'Imported as a new case. Check the AI notes at the top.' : 'New case created');
    const t = $('#f-title'); if (t && !fromDraft && !imported) { t.focus(); t.select(); }
  } catch(e) { toast(e && e.code === 'quota_exceeded' ? 'The case library is full. Delete old cases first.' : 'Could not create the case. Try again.'); }
}
async function deleteCase(){
  const id = S.currentId; if (!id) return;
  clearTimeout(S.saveTimer); S.editSeq = S.savedSeq;
  try {
    await S.db.doc('cases/' + id).delete();
    S.cases.delete(id); S.currentId = null; S.draft = null; S.confirmDel = false;
    const next = sortedCases()[0]; if (next) await openCase(next.id); else { renderList(); renderMain(); }
    toast('Case deleted');
  } catch(e){ toast('Could not delete the case. Try again.'); }
}

/* ---------- live updates ---------- */
function onCases(snap){
  const m = new Map(); snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
  S.cases = m; S.loaded = true;
  if (S.currentId) {
    const c = m.get(S.currentId);
    if (!c) { if (!snap.metadata.fromCache) { S.draft = null; S.currentId = null; toast('This case was deleted by someone else.'); } }
    else if (c.rev && c.rev !== S.draft.rev && !S.ownRevs.has(c.rev)) {
      const busy = S.editSeq > S.savedSeq || (document.activeElement && $('#view').contains(document.activeElement) && document.activeElement.matches('input,textarea,select'));
      if (busy) { if (!S.remoteChanged) { S.remoteChanged = true; renderMain(); } }
      else { S.draft = normalize(c); renderMain(); }
    }
  }
  if (!S.currentId) {
    const last = ls.get('simcase:last');
    const pick = (last && m.has(last)) ? last : (sortedCases()[0] || {}).id;
    if (pick) { S.currentId = null; openCase(pick); }
    else renderMain();
  }
  renderList(); resolveNames();
}

/* ---------- Word export (.docx built in the page) ---------- */
const X = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function runs(text, o = {}){
  const t = String(text ?? '');
  const rpr = `<w:rPr>${o.b?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}${o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:''}</w:rPr>`;
  return t.split('\n').map((line,i) => `${i?`<w:r>${rpr}<w:br/></w:r>`:''}<w:r>${rpr}<w:t xml:space="preserve">${X(line)}</w:t></w:r>`).join('');
}
const val = v => (String(v ?? '').trim() ? String(v) : 'TBC');
const para = (inner, o = {}) => `<w:p><w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after ?? 100}"/>${o.style?`<w:pStyle w:val="${o.style}"/>`:''}</w:pPr>${inner}</w:p>`;
/* Text → Word paragraphs with real hanging-indent bullets/numbers and bold "Label:" prefixes. */
function docParas(text, o = {}){
  const sz = o.sz, after = o.after ?? 60, ind = o.ind || 300;
  const t = String(text || '');
  const lines = t.trim() ? t.split('\n').map(l => l.trim()).filter(Boolean) : ['TBC'];
  let inNum = false;
  return lines.map(raw => {
    let m, mark = '', body = cleanMd(raw), left = ind;
    if ((m = body.match(BULLET_RE))) { mark = '•'; body = m[1]; if (inNum) left = ind * 2; }
    else if ((m = body.match(NUM_RE))) { mark = m[1] + '.'; body = m[2]; inNum = true; }
    else inNum = false;
    const ro = {sz, color:o.color};
    const lab = splitLabel(body);
    const text_ = lab ? runs(lab[0] + (lab[1] ? ' ' : ''), {...ro, b:true}) + (lab[1] ? runs(lab[1], ro) : '') : runs(body, ro);
    const pPr = `<w:pPr><w:spacing w:before="0" w:after="${after}"/>${mark ? `<w:tabs><w:tab w:val="left" w:pos="${left}"/></w:tabs><w:ind w:left="${left}" w:hanging="${ind}"/>` : ''}</w:pPr>`;
    return `<w:p>${pPr}${mark ? runs(mark, ro) + '<w:r><w:tab/></w:r>' : ''}${text_}</w:p>`;
  }).join('');
}
const secHeadDoc = (label, before = 180) => para(runs(label, {b:true, sz:22, color:'1D5E8C'}), {before, after:60});
const labeled = (label, text) => secHeadDoc(label) + docParas(text);
function cell(inner, w, fill){
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${fill}"/><w:tcMar><w:top w:w="80" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tcMar></w:tcPr>${inner}</w:tc>`;
}
function buildDocument(c){
  const W = [2300, 2700, 3150, 3250, 3144];
  const meta = [c.level && 'Learners: '+c.level, c.duration && 'Duration: '+c.duration, (STATUS.find(s=>s[0]===c.status)||STATUS[0])[1]].filter(Boolean).join('  ·  ');
  const vl = vitalsLine(c);
  const head = ['Stage and trigger','Patient or clinical event','Expected learner actions','Facilitator cues','LLEAP and physical actions'];
  const hdrRow = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${head.map((h,i) => cell(para(runs(h,{b:true,sz:20}),{after:0}), W[i], 'E7EDF2')).join('')}</w:tr>`;
  const rows = c.stages.map((s,i) => {
    const fill = i % 2 ? 'FFFFFF' : 'F5F6F7';
    const first = para(runs((i+1)+' · '+(s.name||''),{b:true,sz:20,color:'1D5E8C'}),{after:60}) + docParas(s.trigger,{sz:19,after:50,ind:220});
    return `<w:tr><w:trPr><w:cantSplit/></w:trPr>${cell(first,W[0],fill)}${[s.event,s.actions,s.cues,s.lleap].map((t,k) => cell(docParas(t,{sz:19,after:50,ind:220}),W[k+1],fill)).join('')}</w:tr>`;
  }).join('');
  const border = 'w:val="single" w:sz="4" w:space="0" w:color="C9D2DB"';
  const table = `<w:tbl><w:tblPr><w:tblW w:w="${W.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblLayout w:type="fixed"/>
    <w:tblBorders><w:top ${border}/><w:left ${border}/><w:bottom ${border}/><w:right ${border}/><w:insideH ${border}/><w:insideV ${border}/></w:tblBorders></w:tblPr>
    <w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${hdrRow}${rows}</w:tbl>`;
  const body = [
    para(runs(c.title || 'Untitled case', {b:true, sz:32}), {after:40}),
    meta ? para(runs(meta, {color:'566472', sz:20}), {after:160}) : '',
    (c.scenario||'').trim() ? labeled('Case summary', c.scenario) : '',
    labeled('Objective', c.objective),
    labeled('Patient', c.patient),
    labeled('Learner brief', c.learnerBrief),
    labeled('Roles', c.roles),
    labeled('Setup', c.setup),
    secHeadDoc('Initial settings') + docParas(vl || 'TBC') + (c.vent ? docParas(c.vent) : ''),
    para(runs('Scenario progression', {b:true, sz:26}), {before:240, after:120}),
    table,
    para('', {after:60}),
    labeled('End point', c.end),
    labeled('Debrief', c.debrief)
  ].join('');
  return wrapDoc(body, true);
}
function wrapDoc(body, landscape){
  const sect = landscape
    ? '<w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/><w:pgMar w:top="605" w:right="648" w:bottom="576" w:left="648" w:header="720" w:footer="346" w:gutter="0"/>'
    : '<w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="346" w:gutter="0"/>';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}
<w:sectPr>${sect}</w:sectPr></w:body></w:document>`;
}
function learnerDocument(c, mode){
  const d = learnerDoc(c, mode);
  const body = [
    para(runs(d.title, {b:true, sz:32}), {after:40}),
    para(runs(d.sub, {color:'566472', sz:20}), {after:240}),
    ...d.blocks.map(b => para(runs(b.h, {b:true, sz:24, color:'1D5E8C'}), {before:220, after:80}) + docParas(b.text, b.fixed ? {color:'566472', after:80} : {after:80, ind:340}))
  ].join('');
  return wrapDoc(body, false);
}
const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="100" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
async function buildDocx(docXml){
  if (!window.JSZip) throw new Error('nozip');
  const z = new JSZip();
  z.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  z.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  z.file('word/_rels/document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  z.file('word/document.xml', docXml);
  z.file('word/styles.xml', STYLES);
  return z.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function exportWord(){
  const btn = $('#exportBtn');
  const dl = window.claude ? await window.claude.use('downloads') : null;
  if (!dl) { toast('Word export isn\'t available in this view. Open the page in Claude to download.'); return; }
  btn.disabled = true;
  try {
    const learner = S.view === 'learner';
    const blob = await buildDocx(learner ? learnerDocument(S.draft, S.learnerMode) : buildDocument(S.draft));
    const name = (S.draft.title || 'Simulation case').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,80) || 'Simulation case';
    const suffix = learner ? (S.learnerMode === 'pre' ? ' - learner pre-brief' : ' - debrief handout') : ' - facilitator';
    await dl.save({filename: name + suffix + '.docx', data: blob});
    toast('Word file saved');
  } catch(e) {
    const code = e && e.code;
    if (code === 'declined') toast('Export cancelled');
    else if (code === 'rate_limited') toast('A save prompt is already open. Finish that one first.');
    else if (e && e.message === 'nozip') toast('The Word builder did not load. Reload the page and try again.');
    else toast('Could not export the Word file.');
  } finally { btn.disabled = false; }
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { S.filter = el.value; renderList(); return; }
  if (el.id === 'importIn') { S.importText = el.value; S.confirmReplace = false; refreshImport(); return; }
  const p = el.dataset && el.dataset.path; if (!p || !S.draft || !S.canWrite) return;
  setPath(S.draft, p, el.value);
  if (el.tagName === 'TEXTAREA') autosize(el);
  changed(); refreshFieldTbc(p);
  if (p === 'llmNotes') { const out = $('#promptOut'); if (out) out.value = buildPrompt(S.draft); }
  if (p === 'scenario') {
    const has = !!el.value.trim(), ns = document.querySelector('.next-step');
    if (ns) {
      ns.querySelector('.help').textContent = has ? 'Ready for the AI. It will fill every section below from your scenario, then you review and import.' : 'Write the scenario first. The AI handoff unlocks once it has text.';
      ns.querySelector('button').classList.toggle('primary', has);
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'mobilePick' && e.target.value) openCase(e.target.value);
  if (e.target.id === 'askFirst') { S.askFirst = e.target.checked; ls.set('simcase:askFirst', S.askFirst ? 'on' : 'off'); renderHandoff(); return; }
  if (e.target.id === 'importFile') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 2e6) { toast('That file is too large to be a case file.'); return; }
    const rd = new FileReader();
    rd.onload = () => { S.importText = String(rd.result || ''); S.confirmReplace = false; renderImport(); toast('File loaded: ' + f.name); };
    rd.onerror = () => toast('Could not read that file.');
    rd.readAsText(f);
    e.target.value = '';
  }
});
async function copyPrompt(){
  const text = buildPrompt(S.draft);
  try { await navigator.clipboard.writeText(text); toast('Prompt copied. Paste it into Claude or another AI.'); }
  catch(e) { const out = $('#promptOut'); if (out) { out.focus(); out.select(); } toast('Press Ctrl+C (Cmd+C on Mac) to copy the selected prompt.'); }
}
async function downloadPrompt(){
  const dl = window.claude ? await window.claude.use('downloads') : null;
  if (!dl) { toast('Downloads aren\'t available in this view. Use Copy prompt instead.'); return; }
  try { await dl.save({filename: fileSlug(S.draft.title) + '-ai-handoff.md', data: buildPrompt(S.draft)}); toast('Prompt file saved'); }
  catch(e) { toast(e && e.code === 'declined' ? 'Download cancelled' : 'Could not save the file. Use Copy prompt instead.'); }
}
document.addEventListener('focusout', () => { if (S.editSeq > S.savedSeq) { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(save, 250); } });
document.addEventListener('click', e => {
  const item = e.target.closest('.item[data-id]'); if (item) { openCase(item.dataset.id); return; }
  const tg = e.target.closest('[data-toggle]'); if (tg) { toggleSec(tg.dataset.toggle); return; }
  const ca = e.target.closest('[data-act="collapseAll"],[data-act="expandAll"]');
  if (ca) {
    if (ca.dataset.act === 'collapseAll') document.querySelectorAll('[data-sec]').forEach(el => S.collapsed.add(el.dataset.sec));
    else S.collapsed.clear();
    saveCollapsed(); renderEditor(); return;
  }
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (b.id === 'newBtn' || act === 'new') return createCase();
  if (b.id === 'dupBtn') return S.draft && createCase(S.draft);
  if (b.id === 'tabEdit') { S.view = 'edit'; renderMain(); return; }
  if (b.id === 'tabSheet') { S.view = 'sheet'; renderMain(); return; }
  if (b.id === 'tabHandoff') { S.view = 'handoff'; renderMain(); return; }
  if (b.id === 'tabLearner') { S.view = 'learner'; renderMain(); return; }
  if (act === 'goHandoff') { flush(); S.view = 'handoff'; renderMain(); window.scrollTo(0,0); return; }
  if (act === 'goScenario') {
    S.view = 'edit'; S.collapsed.delete('scenario'); saveCollapsed(); renderMain();
    const t = $('#f-scenario'); if (t) { t.scrollIntoView({block:'center'}); t.focus({preventScroll:true}); }
    return;
  }
  if (act === 'lmode') { S.learnerMode = b.dataset.mode === 'post' ? 'post' : 'pre'; renderLearner(); return; }
  if (b.id === 'copyLearner') return copyLearner();
  if (b.id === 'tabImport' || b.id === 'importBtn' || act === 'goImport') { S.view = 'import'; S.confirmReplace = false; renderMain(); window.scrollTo(0,0); return; }
  if (b.id === 'copyPrompt') return copyPrompt();
  if (b.id === 'dlPrompt') return downloadPrompt();
  if (act === 'importClear') { S.importText = ''; S.confirmReplace = false; renderImport(); return; }
  if (act === 'importNew') return applyImport(true);
  if (act === 'replace') { S.confirmReplace = true; refreshImport(); return; }
  if (act === 'replaceNo') { S.confirmReplace = false; refreshImport(); return; }
  if (act === 'replaceYes') return applyImport(false);
  if (act === 'clearAi') { S.draft.aiNotes = ''; changed(); renderEditor(); toast('AI notes cleared'); return; }
  if (b.id === 'exportBtn') return exportWord();
  if (b.id === 'tipsBtn') { const off = !document.body.classList.contains('tips-off'); document.body.classList.toggle('tips-off', off); b.textContent = off ? 'Show tips' : 'Hide tips'; ls.set('simcase:tips', off ? 'off' : 'on'); return; }
  if (b.id === 'nextTbc') {
    if (S.view !== 'edit') { S.view = 'edit'; renderMain(); }
    const first = document.querySelector('.field.is-tbc');
    if (first) {
      let p = first.closest('[data-sec]');
      while (p) { if (S.collapsed.has(p.dataset.sec)) toggleSec(p.dataset.sec, true); p = p.parentElement && p.parentElement.closest('[data-sec]'); } first.scrollIntoView({block:'center', behavior:'smooth'}); const inp = first.querySelector('textarea,input'); if (inp) setTimeout(() => inp.focus({preventScroll:true}), 300); }
    return;
  }
  if (b.id === 'addStage') {
    S.draft.stages.push({id:rid(), name:'Stage ' + (S.draft.stages.length + 1), trigger:'', event:'', actions:'', cues:'', lleap:''});
    changed(); renderEditor();
    const last = document.querySelector('.stage:last-child input'); if (last) { last.focus(); last.select(); }
    return;
  }
  if (act === 'up' || act === 'down' || act === 'rm') {
    const i = +b.dataset.i, st = S.draft.stages;
    if (act === 'rm') st.splice(i, 1);
    else { const j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= st.length) return; [st[i], st[j]] = [st[j], st[i]]; }
    changed(); renderEditor(); return;
  }
  if (act === 'del') { S.confirmDel = true; $('#foot').innerHTML = footHtml(); return; }
  if (act === 'delNo') { S.confirmDel = false; $('#foot').innerHTML = footHtml(); return; }
  if (act === 'delYes') return deleteCase();
  if (act === 'loadRemote') {
    const c = S.cases.get(S.currentId);
    if (c) { clearTimeout(S.saveTimer); S.editSeq = S.savedSeq; S.draft = normalize(c); }
    S.remoteChanged = false; renderMain(); return;
  }
});
window.addEventListener('resize', () => document.querySelectorAll('#view textarea').forEach(autosize));
setInterval(() => { renderSaveState(); }, 30000);

/* ---------- boot ---------- */
if (ls.get('simcase:askFirst') === 'off') S.askFirst = false;
try { const cs = JSON.parse(ls.get('simcase:collapsed') || '[]'); if (Array.isArray(cs)) S.collapsed = new Set(cs.map(String)); } catch(e){}
if (ls.get('simcase:tips') === 'off') { document.body.classList.add('tips-off'); $('#tipsBtn').textContent = 'Show tips'; }
renderList();
(async () => {
  const C = window.claude;
  const [db, user] = C ? await Promise.all([C.use('db'), C.use('user')]) : [null, null];
  S.db = db; S.user = user;
  if (!db) { S.noStore = true; S.loaded = true; renderList(); renderMain(); return; }
  if (user) {
    try { S.myId = await user.id(); } catch(e){}
    const w = await safeCan(); if (w === false) S.canWrite = false;
  }
  renderList();
  db.collection('cases').onSnapshot(onCases, err => {
    S.err = 'Lost connection to the case library. Reload the page.'; renderSaveState(); toast(S.err);
  });
})();
})();
</script>
</body>
</html>
